name: CI Backend Spring

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Build y Test Gradle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Dar permisos al wrapper
        run: chmod +x gradlew

      - name: Ejecutar tests
        run: ./gradlew test --no-daemon
