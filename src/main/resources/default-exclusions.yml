exclusions:
  directories:
    - node_modules/
    - target/
    - build/
    - .git/
    - vendor/
    - dist/
    - __pycache__/
    - .idea/
    - .vscode/
    - coverage/
    - .nyc_output/
    - .venv/
    - venv/
    - .tox/
    - .pytest_cache/
    - .mypy_cache/
    - .gradle/
    - .next/
    - .nuxt/
    - .cache/
  files:
    - "*.min.js"
    - "*.pyc"
    - "*.class"
    - "*.jar"
    - "*.war"
