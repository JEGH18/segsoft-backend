spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pdgseg_test}
    username: ${DB_USER:pdgseg_test}
    password: ${DB_PASSWORD:pdgseg_test}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  security:
    user:
      name: disabled

server:
  port: 8080
  shutdown: graceful

jwt:
  private-key: ${JWT_PRIVATE_KEY:unused}
  secret: ${JWT_SECRET:dev-secret-for-local-development-minimum-32-chars-ok}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 28800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

engine:
  base-url: ${ENGINE_BASE_URL:http://localhost:18001}
  service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}
  connect-timeout-ms: 5000
  read-timeout-ms: 60000

sandbox:
  root: ${SANDBOX_ROOT:/tmp/pdgseg-sandbox}
  max-repo-size-mb: ${MAX_REPO_SIZE_MB:100}
  max-file-count: ${MAX_FILE_COUNT:5000}
  max-compression-ratio: ${MAX_COMPRESSION_RATIO:100}
  allowed-git-domains: ${ALLOWED_GIT_DOMAINS:github.com,gitlab.com,bitbucket.org}

rule:
  timeout-ms: ${RULE_TIMEOUT_MS:30000}

traceability:
  retention-days: ${TRACEABILITY_RETENTION_DAYS:365}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    probes:
      enabled: true

logging:
  config: classpath:logback-spring.xml
