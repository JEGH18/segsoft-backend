spring:
  main:
    # The log is JSON lines (logback-spring.xml); the ASCII banner would break it.
    banner-mode: off
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pdgseg_test}
    username: ${DB_USER:pdgseg_test}
    password: ${DB_PASSWORD:pdgseg_test}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  security:
    user:
      name: disabled
  # SMTP for the verification emails (Brevo: smtp-relay.brevo.com:587, with the SMTP login and
  # SMTP key of the account). Without MAIL_HOST no email is sent and registration answers 503.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8080
  shutdown: graceful
  # Spring Boot's own /error page (errors outside the controllers): never the stack trace nor
  # the exception message; GlobalExceptionHandler covers the controllers.
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

jwt:
  private-key: ${JWT_PRIVATE_KEY:unused}
  secret: ${JWT_SECRET:dev-secret-for-local-development-minimum-32-chars-ok}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 28800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

auth:
  registration:
    # Self-registration creates DEVELOPER accounts; AUDITOR and SECURITY_ADMIN come from SEGSOFT_ACCOUNTS.
    enabled: ${SEGSOFT_REGISTRATION_ENABLED:true}
    max-per-ip-per-hour: ${REGISTRATION_MAX_PER_IP_PER_HOUR:20}
    max-per-hour: ${REGISTRATION_MAX_PER_HOUR:100}
  email-verification:
    from: ${MAIL_FROM:no-reply@segsoft.website}
    from-name: SegSoft
    token-ttl: PT24H
    # Accounts that never verify their email are deleted after this long, freeing name and email.
    unverified-retention: P7D
    # Local development only: writes the verification link to the log when there is no SMTP.
    log-links: false
  password-reset:
    # How long the link of a password reset email works.
    token-ttl: PT30M

# Public URL of the frontend; the verification links point to it, never to the request's Host.
app:
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  # Shared with the Vercel middleware, which sends it with the real client IP (ClientIpResolver).
  # Empty: that header is ignored and the IP is the one Caddy saw.
  trusted-proxy-secret: ${TRUSTED_PROXY_SECRET:}

engine:
  base-url: ${ENGINE_BASE_URL:http://localhost:18001}
  service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}
  connect-timeout-ms: 5000
  # A batch request can take up to the engine's BATCH_TIMEOUT_SECONDS (120 s by default).
  read-timeout-ms: ${ENGINE_READ_TIMEOUT_MS:180000}
  # Files sent to the engine per request (one rule over many files).
  batch-size: ${ENGINE_BATCH_SIZE:100}
  # Ping of /actuator/health/readiness to the engine's /internal/health.
  health-timeout-ms: ${ENGINE_HEALTH_TIMEOUT_MS:2000}

sandbox:
  root: ${SANDBOX_ROOT:/tmp/pdgseg-sandbox}
  max-repo-size-mb: ${MAX_REPO_SIZE_MB:100}
  max-file-count: ${MAX_FILE_COUNT:5000}
  max-compression-ratio: ${MAX_COMPRESSION_RATIO:100}
  # Absolute limit on what a ZIP may expand to, whatever its compression ratio.
  max-extracted-size-mb: ${MAX_EXTRACTED_SIZE_MB:500}
  allowed-git-domains: ${ALLOWED_GIT_DOMAINS:github.com,gitlab.com,bitbucket.org,pi2tools.icesi.edu.co}
  # Bitbucket Server / Data Center: the access token is sent as a Bearer header.
  bitbucket-server-hosts: ${BITBUCKET_SERVER_HOSTS:pi2tools.icesi.edu.co}

rule:
  timeout-ms: ${RULE_TIMEOUT_MS:30000}

report:
  export:
    # Larger exports are rejected with HTTP 422 and never cached.
    max-size-mb: ${MAX_EXPORT_SIZE_MB:50}
    cache:
      dir: ${EXPORT_CACHE_DIR:${java.io.tmpdir}/pdgseg-export-cache}
      # How long an exported file is reused; PT0S disables the cache.
      ttl: ${EXPORT_CACHE_TTL:PT1H}
      cleanup-interval: ${EXPORT_CACHE_CLEANUP_INTERVAL:PT15M}
  sarif:
    # Filled in by Maven resource filtering with the pom version.
    tool-version: "@project.version@"
    information-uri: ${SARIF_INFORMATION_URI:https://pi2tools.icesi.edu.co/bitbucket/projects/SEGSOFT/repos/segsoft-backend}

traceability:
  retention-days: ${TRACEABILITY_RETENTION_DAYS:365}

# Observability (healthchecks, Prometheus metrics, JSON logs with traceId): deploy/observability/README.md
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Details (response times, errors) only for authenticated users.
      show-details: when-authorized
      probes:
        enabled: true
      group:
        # Is the process alive? Nothing but its own state: never restart it for a dependency.
        liveness:
          include: livenessState
          show-details: never
          show-components: never
        # Can it serve requests? 503 as soon as one dependency is down. The status of each
        # dependency is public; its details are not.
        readiness:
          include: readinessState,postgres,sandbox,engine
          show-components: always
          show-details: when-authorized
  health:
    probes:
      enabled: true
    # Replaced by the "postgres" indicator (SELECT 1).
    db:
      enabled: false
    # An SMTP outage must not mark the backend as down, nor every health check open a connection.
    mail:
      enabled: false
  info:
    build:
      enabled: true
  metrics:
    tags:
      application: segsoft-backend
    distribution:
      # Buckets for the HTTP latency percentiles of the Grafana dashboard.
      percentiles-histogram:
        http.server.requests: true

logging:
  config: classpath:logback-spring.xml
