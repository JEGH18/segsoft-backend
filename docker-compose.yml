services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_POSTGRES_DB}
      POSTGRES_USER: ${DB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_POSTGRES_USER} -d ${DB_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend-spring:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      engine-python:
        condition: service_started
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: default
    volumes:
      - sandbox:/tmp/pdgseg-sandbox

  engine-python:
    build:
      context: ../segsoft-motorpython
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - sandbox:/tmp/pdgseg-sandbox

volumes:
  pgdata:
  sandbox:
